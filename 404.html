<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Arte Mentis</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet">
<style>
  :root {
    --tile: #B5543B;
    --tile-deep: #9C4732;
    --ink: #241D18;
    --paper: #FBF8F4;
    --muted: #6E635A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "EB Garamond", Georgia, "Times New Roman", serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 1.1875rem;
    line-height: 1.68;
    -webkit-font-smoothing: antialiased;
    min-height: 100svh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 2rem 1.5rem;
  }
  .wordmark {
    font-weight: 500;
    font-size: 1.15rem;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    color: var(--tile);
    padding-left: 0.17em;
  }
  .rule {
    width: 3.5rem;
    height: 2px;
    background: var(--tile);
    margin: 1.8rem auto;
  }
  h1 {
    font-weight: 500;
    font-size: clamp(1.9rem, 5.5vw, 2.6rem);
    line-height: 1.2;
  }
  p { margin-top: 1rem; color: var(--muted); max-width: 30em; }
  a.button {
    display: inline-block;
    margin-top: 2.2rem;
    font-size: 1.02rem;
    font-weight: 500;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--tile);
    text-decoration: none;
    padding: 0.85rem 2rem;
    border-radius: 2px;
  }
  a.button:hover { background: var(--tile-deep); }
  a:focus-visible { outline: 2px solid var(--tile); outline-offset: 3px; }
</style>
</head>
<body>
  <main class="card">
    <div class="wordmark">Arte Mentis</div>
    <div class="rule"></div>
    <h1>This page doesn&rsquo;t exist.</h1>
    <p>The address may have been mistyped, or the page has moved. Everything lives on one page anyway.</p>
    <a class="button" href="/">Back to the site</a>
  </main>
</body>
</html>
